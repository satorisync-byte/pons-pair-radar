name: Aggiorna Pons Radar
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
  push:
    paths: ['presets.json', 'template.html', 'preset_template.html', 'aggregate.py']
permissions:
  contents: write
concurrency:
  group: pons-radar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python aggregate.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add index.html preset.html data.json history.json logs_cache.json
          if git diff --cached --quiet; then echo "Nessuna modifica"; else git commit -m "Aggiornamento automatico $(date -u +%FT%TZ)" && (git push || (git pull --rebase -X theirs && git push)); fi
